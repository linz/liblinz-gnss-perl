name: Test

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libconfig-general-perl libarchive-zip-perl libdbd-sqlite3-perl \
            libdbi-perl libipc-run-perl liblog-log4perl-perl \
            libtime-modules-perl libmath-libm-perl liburi-perl \
            libxml-simple-perl libxml-libxml-perl libfile-which-perl \
            libfile-copy-recursive-perl libwww-perl libperlio-gzip-perl \
            libmodule-build-perl gzip ncompress

      - name: Write GNSS archive credentials
        env:
          GNSS_ARCHIVE_CREDENTIALS: ${{ secrets.GNSS_ARCHIVE_CREDENTIALS }}
        run: |
          # JSON: {"username": "...", "password": "..."}, as referenced by test/getdata.conf
          mkdir -p "$HOME/.credentials"
          printf '%s\n' "$GNSS_ARCHIVE_CREDENTIALS" > "$HOME/.credentials/linz-gnss-archive-credentials.json"
          chmod 600 "$HOME/.credentials/linz-gnss-archive-credentials.json"
          # run_tests.sh only checks that this file exists
          touch "$HOME/.gnss-archive-credentials"

      - name: Run tests
        working-directory: test
        run: |
          ./run_tests.sh | tee test_output.txt
          # run_tests.sh finishes with a diff against test/check
          # and always exits 0, so fail if the diff reported differences.
          if sed -n '/^Differences/,$p' test_output.txt | grep -q '^[<>0-9]'; then
            echo "Test output differs from expected results"
            exit 1
          fi
